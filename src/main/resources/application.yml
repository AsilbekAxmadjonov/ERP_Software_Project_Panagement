server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/erp;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt:
    # override with JWT_SECRET in any real environment (min 32 chars)
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-hours: 12
  cors-origins: http://localhost:5173
  bootstrap:
    admin-username: ${ERP_ADMIN_USERNAME:}
    admin-password: ${ERP_ADMIN_PASSWORD:}
